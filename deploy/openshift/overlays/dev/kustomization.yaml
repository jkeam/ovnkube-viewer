apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ovnkube-viewer-dev

namePrefix: dev-

resources:
  - ../../base

labels:
  - pairs:
      environment: development

patches:
  # Reduce replicas for dev environment
  - target:
      kind: Deployment
      name: ovnkube-viewer-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: ovnkube-viewer-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Update namespace references
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: ovnkube-viewer-dev

  - target:
      kind: ClusterRoleBinding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: ovnkube-viewer-dev

  # Update ConsolePlugin namespace and service name references
  - target:
      kind: ConsolePlugin
      name: ovnkube-viewer
    patch: |-
      - op: replace
        path: /spec/backend/service/name
        value: dev-ovnkube-viewer-plugin
      - op: replace
        path: /spec/backend/service/namespace
        value: ovnkube-viewer-dev
      - op: replace
        path: /spec/proxy/0/endpoint/service/name
        value: dev-ovnkube-viewer-backend
      - op: replace
        path: /spec/proxy/0/endpoint/service/namespace
        value: ovnkube-viewer-dev

  # Update ConfigMap for dev environment
  - target:
      kind: ConfigMap
      name: ovnkube-viewer-config
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "*"
      - op: add
        path: /data/LOG_LEVEL
        value: "debug"

  # Update nginx ConfigMap to use dev-prefixed backend service
  - target:
      kind: ConfigMap
      name: ovnkube-viewer-nginx-config
    patch: |-
      - op: replace
        path: /data/default.conf
        value: |
          # Serve static files with fallback to index.html for SPA routing
          location / {
              try_files $uri $uri/ /index.html;
          }

          # Proxy API requests to backend service
          location /api {
              proxy_pass http://dev-ovnkube-viewer-backend:8080;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
              proxy_connect_timeout 60s;
              proxy_send_timeout 60s;
              proxy_read_timeout 60s;
          }

  # Update Route service reference to match prefixed service name
  - target:
      kind: Route
      name: ovnkube-viewer
    patch: |-
      - op: replace
        path: /spec/to/name
        value: dev-ovnkube-viewer-frontend

images:
  - name: quay.io/jkeam0/ovnkube-viewer-backend
    newTag: dev
  - name: quay.io/jkeam0/ovnkube-viewer-frontend
    newTag: dev
  - name: quay.io/jkeam0/ovnkube-viewer-plugin
    newTag: dev
