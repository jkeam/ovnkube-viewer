apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ovnkube-viewer

resources:
  - ../../base

commonLabels:
  environment: production

patches:
  # Increase replicas for production
  - target:
      kind: Deployment
      name: ovnkube-viewer-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: ovnkube-viewer-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Increase resource limits for production
  - target:
      kind: Deployment
      name: ovnkube-viewer-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"

  - target:
      kind: Deployment
      name: ovnkube-viewer-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m

  # Update ConfigMap for production environment
  - target:
      kind: ConfigMap
      name: ovnkube-viewer-config
    patch: |-
      - op: add
        path: /data/LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/TRACE_TIMEOUT
        value: "60s"

images:
  - name: quay.io/yourorg/ovnkube-viewer-backend
    newTag: v1.0.0
  - name: quay.io/yourorg/ovnkube-viewer-frontend
    newTag: v1.0.0
  - name: quay.io/yourorg/ovnkube-viewer-plugin
    newTag: v1.0.0
