apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ovnkube-viewer

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - configmap.yaml
  - frontend-nginx-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - route.yaml
  - console-plugin.yaml
  - plugin-deployment.yaml
  - plugin-service.yaml

commonLabels:
  app: ovnkube-viewer
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ovnkube-viewer-backend
    newName: quay.io/jkeam/ovnkube-viewer-backend
    newTag: latest
  - name: ovnkube-viewer-frontend
    newName: quay.io/jkeam/ovnkube-viewer-frontend
    newTag: latest
  - name: ovnkube-viewer-plugin
    newName: quay.io/jkeam/ovnkube-viewer-plugin
    newTag: latest
