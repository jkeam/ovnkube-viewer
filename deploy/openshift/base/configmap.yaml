apiVersion: v1
kind: ConfigMap
metadata:
  name: ovnkube-viewer-config
  namespace: ovnkube-viewer
  labels:
    app: ovnkube-viewer
    app.kubernetes.io/name: ovnkube-viewer
data:
  # Backend configuration
  PORT: "8080"

  # OVN configuration
  OVN_NAMESPACE: "openshift-ovn-kubernetes"
  OVN_MASTER_POD_LABEL: "app=ovnkube-master"
  OVN_NODE_POD_LABEL: "app=ovnkube-node"

  # Trace configuration
  TRACE_TIMEOUT: "30s"
  MAX_TRACE_LENGTH: "10000"

  # CORS configuration (will be overridden in overlays)
  CORS_ALLOWED_ORIGINS: "*"
