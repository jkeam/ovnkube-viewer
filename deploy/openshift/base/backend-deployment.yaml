apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovnkube-viewer-backend
  namespace: ovnkube-viewer
  labels:
    app: ovnkube-viewer
    app.kubernetes.io/name: ovnkube-viewer
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ovnkube-viewer
      component: backend
  template:
    metadata:
      labels:
        app: ovnkube-viewer
        component: backend
        app.kubernetes.io/name: ovnkube-viewer
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: ovnkube-viewer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ovnkube-viewer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: PORT
            - name: OVN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: OVN_NAMESPACE
            - name: OVN_MASTER_POD_LABEL
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: OVN_MASTER_POD_LABEL
            - name: OVN_NODE_POD_LABEL
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: OVN_NODE_POD_LABEL
            - name: TRACE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: TRACE_TIMEOUT
            - name: MAX_TRACE_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: MAX_TRACE_LENGTH
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ovnkube-viewer-config
                  key: CORS_ALLOWED_ORIGINS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
