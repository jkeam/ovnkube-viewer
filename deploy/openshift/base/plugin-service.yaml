apiVersion: v1
kind: Service
metadata:
  name: ovnkube-viewer-plugin
  namespace: ovnkube-viewer
  labels:
    app: ovnkube-viewer
    app.kubernetes.io/name: ovnkube-viewer
    app.kubernetes.io/component: console-plugin
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ovnkube-viewer-plugin-cert
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9443
      targetPort: http
      protocol: TCP
  selector:
    app: ovnkube-viewer
    component: console-plugin
