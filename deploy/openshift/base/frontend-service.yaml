apiVersion: v1
kind: Service
metadata:
  name: ovnkube-viewer-frontend
  namespace: ovnkube-viewer
  labels:
    app: ovnkube-viewer
    app.kubernetes.io/name: ovnkube-viewer
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: ovnkube-viewer
    component: frontend
